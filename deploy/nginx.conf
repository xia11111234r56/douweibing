# /etc/nginx/sites-available/dc2-api.conf（由 provision.sh 软链启用）
# 同一域名同时承载：Web 管理平台（静态 SPA）+ 后端 API（反代）。
# 部署后把两处 api.douweibing.cn 改成你的真实域名。

# HTTP → HTTPS 强制跳转 + 证书签发用
server {
    listen 80;
    server_name api.douweibing.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主入口
server {
    listen 443 ssl;
    server_name api.douweibing.cn;

    ssl_certificate     /etc/letsencrypt/live/api.douweibing.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.douweibing.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 小程序端会先压缩图片再上传，但 base64 后的 JSON 体积会放大；
    # 留足余量，避免大图被 413 拒掉。
    client_max_body_size 20m;

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # MobileSAM 严重度推理较慢，读超时放长
        proxy_read_timeout 90s;
    }

    # FastAPI 自动文档（交互式，答辩演示用）
    location = /docs    { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }
    location = /redoc   { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }

    # Web 管理平台（Vue SPA 静态资源）
    location / {
        root /opt/dc2/web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
